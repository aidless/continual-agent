name: import smoke (no tests)

# This repo has no test suite: the 250 files matching test_*.py are task fixtures
# under bench/data/tasks/**/workspace/, not tests. Running pytest here would
# collect nothing and report success, which would be worse than no CI at all.
#
# What this does check: every module in agent/, continual/ and bench/ can be
# imported from a clean interpreter. That catches broken imports, circular
# imports and missing modules. It says nothing about whether the agent behaves
# correctly.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  import-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # requirements.txt pins pytest only; nothing at runtime imports it. The
      # install is here so a broken requirement still shows up as a failure.
      - name: Install declared requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Import every module
        run: |
          python - <<'PY'
          import importlib
          import pkgutil

          total = 0
          for pkg in ("agent", "continual", "bench"):
              importlib.import_module(pkg)
              total += 1
              for mod in pkgutil.walk_packages([pkg], prefix=pkg + "."):
                  importlib.import_module(mod.name)
                  total += 1
          print(f"imported {total} modules from agent/ continual/ bench/")
          PY
